# RTX 4050 Training Configuration
# Optimized for ~6GB VRAM, ~100W TDP

# Model configuration (small model ~120M params)
model:
  vocab_size: 200
  hidden_size: 768
  num_layers: 12
  num_heads: 8
  num_key_value_heads: 4
  intermediate_size: 1536
  max_position_embeddings: 2048
  dropout: 0.1
  use_rope: true
  rope_theta: 10000.0

# Training configuration
training:
  # Duration
  duration:
    num_train_epochs: 3
    max_steps: 10000

  # Batch (optimized for 6GB VRAM)
  batch:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8  # Effective batch = 16

  # Optimizer
  optimizer:
    type: adamw
    learning_rate: 5.0e-5
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-8

  # Scheduler
  scheduler:
    type: cosine
    warmup_ratio: 0.1
    warmup_steps: 500
    min_lr_ratio: 0.1

  # Strategy
  strategy:
    gradient_accumulation_steps: 8
    max_grad_norm: 1.0

  # Regularization
  regularization:
    label_smoothing: 0.0
    dropout: 0.1

  # Mixed precision
  precision:
    use_amp: true
    amp_dtype: bfloat16  # Use bf16 if supported

  # Checkpointing
  checkpointing:
    save_steps: 1000
    save_total_limit: 3
    keep_last_n: 3

  # Logging
  logging:
    level: INFO
    log_every: 25
    logging_dir: ./logs

  # Output
  output_dir: ./checkpoints/chat_sft

# Data configuration
data:
  # Chat dataset
  chat:
    max_length: 1024
    min_length: 10

  # Mixing ratios
  ratios:
    chat: 1.0
    code: 0.0
    text: 0.0

# Hardware
hardware:
  device: cuda
  num_devices: 1
  prefetch_factor: 2
  num_workers: 0  # Debug: use 0 for stability
  pin_memory: true