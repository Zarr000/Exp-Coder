# Expera Coder 3B Model Configuration
# Large model for complex reasoning and long-context tasks

model:
  name: expera-coder-3b
  path: checkpoints/expera_coder_3b
  tokenizer: tokenizer/expera-coder
  type: causal-lm

architecture:
  model_type: gpt
  vocab_size: 32000
  hidden_size: 3072
  num_hidden_layers: 32
  num_attention_heads: 24
  intermediate_size: 12288
  max_position_embeddings: 4096

performance:
  parameters: 3_000_000_000
  parameters_estimated: 3B
  size_mb: 6144
  precision: fp16
  context_length: 4096

inference:
  max_batch_size: 1
  max_tokens: 4096
  default_tokens: 2048
  recommended_temperature: 0.7
  recommended_top_p: 0.9
  recommended_top_k: 40

hardware:
  min_gpu_memory_mb: 8192
  recommended_gpu_memory_mb: 12288
  supports_quantization: true
  quantizations:
    - fp16
    - q4
    - q5
    - q8
  supports_cpu: false

capabilities:
  code_generation: true
  chat: true
  infill: true
  reasoning: true
  completion: true
  long_context: true

use_cases:
  - Most complex code tasks
  - Repository-level analysis
  - Long context understanding
  - Advanced multi-language code
  - Production code generation
  - Cloud deployment

deployment:
  local: false
  vps: false
  cloud: true
  edge: false

# Default inference parameters
generate:
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  presence_penalty: 0.0
  frequency_penalty: 0.0