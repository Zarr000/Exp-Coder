# Expera 3B Model Configuration
# Large model for production and complex tasks

model:
  name: expera-3b
  version: "1.0"

architecture:
  model_type: causal_lm
  architecture: gpt

  vocab_size: 32000
  tie_word_embeddings: false

  embedding_dim: 3072

  num_layers: 32
  num_heads: 24
  kv_heads: 24

  hidden_dim: 12288

  max_position_embeddings: 4096

  rms_norm_eps: 1.0e-5
  norm_first: false

  activation: gelu

  attention_dropout: 0.0
  hidden_dropout: 0.0

  initializer_range: 0.02

rope:
  enabled: true
  type: yarn
  scaling: 2.0
  original_max_pos_embeddings: 2048

attention:
  type: flash
  bias: false

moe:
  enabled: false
  num_experts: 8
  top_k: 2

training:
  optimizer: adamw
  learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8

  scheduler: cosine
  warmup_steps: 2000
  min_lr_ratio: 0.1

  batch_size: 64
  gradient_accumulation: 8
  max_seq_length: 4096

  precision: bf16

  clip_grad_value: 1.0

inference:
  batch_size: 1
  max_tokens: 4096
  temperature: 0.7
  top_p: 0.9
  top_k: 40

quantization:
  bits: 16
  method: default

hardware:
  gpu_memory_min_gb: 16
  gpu_memory_recommended_gb: 24

  inference_batch_size: 1
  max_batch_size: 2

  supports_cpu: false
  cpu_inference: false

capabilities:
  code_generation: true
  chat: true
  infill: true
  reasoning: true
  completion: true
  long_context: true

parameters: 3_000_000_000
size_mb: 6144
size_reduced_mb: 3072