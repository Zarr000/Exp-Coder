# Expera-Tiny (33M parameters)
# Smallest model for edge devices and quick experiments

# Architecture
model_type: "decoder-only"
architectures: ["LlamaForCausalLM"]

# Model config
hidden_size: 384
intermediate_size: 512
num_hidden_layers: 8
num_attention_heads: 6
num_key_value_heads: 6
hidden_act: "silu"
max_position_embeddings: 2048
vocab_size: 32000
rope_theta: 10000.0
rope_scaling: null

# Attention
attention_dropout: 0.0
attention_bias: false
attention_head_dim: 64

# Initialization
initializer_range: 0.02
rms_norm_eps: 1e-5
use_cache: true

# Tokenizer
tokenizer_class: "LlamaTokenizer"
bos_token: "<bos>"
eos_token: "<eos>"
pad_token: "<pad>"
unk_token: "<unk>"
model_max_length: 2048

# Training (to be overridden)
learning_rate: 1e-3
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1e-8
weight_decay: 0.1
max_grad_norm: 1.0
num_train_epochs: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
eval_steps: 200
save_steps: 500
logging_steps: 25
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
fp16: false
bf16: true
dataloader_num_workers: 4
remove_unused_columns: false

# Data
train_file: "data/processed/code/train.jsonl"
validation_file: "data/processed/code/val.jsonl"
max_seq_length: 1024
preprocessing_num_workers: 4

# Output
output_dir: "checkpoints/expera-tiny"
logging_dir: "logs/expera-tiny"

# Labels
label_names: ["labels"]