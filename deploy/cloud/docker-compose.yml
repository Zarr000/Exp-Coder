# Expera AI Cloud Docker Compose
# Optimized for cloud GPU instances with auto-scaling
version: "3.8"

services:
  expera-api:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    image: expera-ai:cloud
    container_name: expera-api-cloud
    ports:
      - "8000:8000"
    volumes:
      - ../../checkpoints:/app/checkpoints
      - ../../tokenizer:/app/tokenizer
      - model-cache:/app/cache
      - app-logs:/app/logs
    environment:
      - MODEL_PATH=/app/checkpoints/expera_coder_1b
      - DEVICE=cuda
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
    env_file:
      - ../../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - expera-cloud-net

  # Load balancer
  nginx:
    image: nginx:latest
    container_name: expera-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - expera-api
    networks:
      - expera-cloud-net

  # Prometheus metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: expera-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - expera-cloud-net

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: expera-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - expera-cloud-net

volumes:
  model-cache:
  app-logs:
  prometheus-data:
  grafana-data:

networks:
  expera-cloud-net:
    driver: bridge