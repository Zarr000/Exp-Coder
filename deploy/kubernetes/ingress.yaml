# Kubernetes Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expera-ingress
  namespace: expera-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: expera.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: expera-api
            port:
              number: 80